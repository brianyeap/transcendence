services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev -- --hostname 0.0.0.0 # Listen on all interfaces
    environment:
      NEXT_TELEMETRY_DISABLED: "1" # Disable Next.js collecting telemetry data
      WATCHPACK_POLLING: "true" # Enable polling for file changes
    ports:
      - "${WEB_PORT:-3000}:3000" # use web port from .env or default to 3000
    volumes:
      - .:/app # Mount the entire project directory to /app in the container
      - web_node_modules:/app/node_modules # Mount the node_modules directory to persist dependencies
      - web_next_cache:/app/.next # Mount the .next directory to persist build cache
    networks:
      - transcendence

  socket:
    build:
      context: ./socket
      dockerfile: Dockerfile
    # Give the socket container the Supabase URL + secret key it needs to write
    # match data. env_file loads them straight from .env.local into the container
    # (the server's dotenv line only works when running outside Docker).
    env_file:
      - .env.local
    ports:
      - "4000:4000"
    networks:
      - transcendence

  prometheus:
    image: prom/prometheus:v3.9.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - transcendence

  grafana:
    image: grafana/grafana:12.3.1
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    env_file:
      - .env.local
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - transcendence

volumes:
  web_node_modules:
  web_next_cache:
  prometheus_data:
  grafana_data:

networks:
  transcendence:
    name: transcendence_dev
