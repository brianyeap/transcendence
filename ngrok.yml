# Tunnels for playing across two computers (used by run_ngrok.sh).
# No secrets here: your authtoken stays in ngrok's own config file.
# Both addresses are https (our proxy and Grafana use self-signed certificates).
version: "3"
tunnels:
  web:            # the app players open (the match engine is reached through it too)
    proto: http
    addr: https://localhost:3000
  grafana:        # optional monitoring dashboard
    proto: http
    addr: https://localhost:3001
