apiVersion: 1
policies:
    - orgId: 1
      receiver: transcendence
      group_by:
        - grafana_folder
        - alertname
      routes:
        - receiver: transcendence
          object_matchers:
            - - severity
              - =
              - critical
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
