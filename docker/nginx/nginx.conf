# WebSockets start as a normal request that asks to "Upgrade".
# This passes that request on, so live matches (Socket.IO)
# keep working through the proxy.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 443 ssl;
  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;

  # Someone typed http:// instead of https://: send them to the https address.
  error_page 497 =301 https://$http_host$request_uri;

  # Avatars can be up to 5 MB (nginx only allows 1 MB by default).
  client_max_body_size 6m;

  # Ask Docker's DNS where "web" and "socket" are each time, so a
  # recreated container (new IP) is found again.
  resolver 127.0.0.11 valid=10s;
  set $web_app      http://web:3000;
  set $match_engine http://socket:4000;

  # Settings used by both locations below.
  proxy_http_version 1.1;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;
  proxy_set_header Host              $http_host;
  # Tell the app the real address the player used (the OAuth callback needs it).
  proxy_set_header X-Forwarded-Host  $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

  # The match engine (Socket.IO always uses the /socket.io/ path).
  location /socket.io/ {
    proxy_pass $match_engine;
  }

  # Everything else is the Next.js web app.
  location / {
    proxy_pass $web_app;
  }
}
